<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <style>
        /* Title block mate */
.chat-header {
    background-color: #007bff; /* Blue color */
    color: white;
    padding: 15px;
    text-align: center;
    width: 400px; 
    margin: 0 auto; 
    border-radius: 10px 10px 0 0; 
}

.chat-header h2 {
    margin: 0;
    font-size: 18px;
}

.chat-header p {
    margin: 5px 0 0;
    font-size: 12px;
    opacity: 0.9;
}


.chat-container {
    width: 400px;
    height: 500px;
    margin: 0 auto;
    background: #1e1e1e;
    border-radius: 0 0 10px 10px; 
    display: flex;
    flex-direction: column;
}
        body { font-family: sans-serif; background: #121212; color: white; display: flex; justify-content: center; padding: 20px; }
        .chat-container { width: 100%; max-width: 600px; background: #1e1e1e; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; height: 80vh; border: 1px solid #333; }
        #chatbox { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .input-area { display: flex; padding: 15px; background: #252525; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: none; background: #333; color: white; outline: none; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:disabled { background: #555; }
        .user-msg { align-self: flex-end; background: #007bff; padding: 10px 15px; border-radius: 15px 15px 0 15px; max-width: 80%; }
        .bot-msg { align-self: flex-start; background: #333; padding: 10px 15px; border-radius: 15px 15px 15px 0; max-width: 80%; line-height: 1.5; }
    </style>
</head>
<body>
<div class="chat-header">
    <h2>🤖 Cross-Browser Assistant</h2>
    <p>Ask me about Compatibility, Advantages, or Tools</p>
</div>
<div class="chat-container">
    <div id="chatbox"></div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Ask something..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>async function sendMessage() {
    const inputField = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const chatbox = document.getElementById("chatbox");
    const message = inputField.value.trim();

    if (!message) return;

    chatbox.innerHTML += `<div class="user-msg">${message}</div>`;
    inputField.value = "";
    chatbox.scrollTop = chatbox.scrollHeight;

    sendBtn.disabled = true;

    const typing = document.createElement("div");
    typing.className = "bot-msg";
    typing.id = "typing";
    typing.innerHTML = "Typing<span id='dots'>.</span>";
    chatbox.appendChild(typing);

   
    let dots = 1;
    const interval = setInterval(() => {
        dots = (dots % 3) + 1;
        document.getElementById("dots").innerText = ".".repeat(dots);
    }, 400);

    chatbox.scrollTop = chatbox.scrollHeight;

    try {
        const response = await fetch("/chat", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ message: message })
        });

        const data = await response.json();

       
        clearInterval(interval);
        document.getElementById("typing").remove();

       
        chatbox.innerHTML += `<div class="bot-msg">${data.reply}</div>`;

    } catch (error) {
        clearInterval(interval);
        document.getElementById("typing").remove();

        chatbox.innerHTML += `
        <div class="bot-msg" style="color:red;">
            Error: Could not connect to server.
        </div>`;
    } finally {
        sendBtn.disabled = false;
        chatbox.scrollTop = chatbox.scrollHeight;
    }
}
</script>

</body>
</html>
